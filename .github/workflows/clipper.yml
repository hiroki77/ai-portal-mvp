name: 中町兄妹 切り抜き自動生成

on:
  # 3時間ごとに新着チェック（UTC基準）
  schedule:
    - cron: '0 */3 * * *'

  # ブラウザの「Run workflow」ボタンから手動実行
  workflow_dispatch:
    inputs:
      url:
        description: '動画URL（空欄なら新着チェック）'
        required: false
        type: string
      count:
        description: '生成クリップ数 (デフォルト: 3)'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.cloud.txt

      # ffmpeg: 動画処理 / fonts-noto-cjk: 日本語フォント / rclone: Google Driveアップロード
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
            rclone

      - name: Install Python dependencies
        run: pip install -r requirements.cloud.txt

      # RCLONE_CONFIG 未設定の場合は Drive を無効化して続行
      - name: Setup rclone
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "${{ secrets.RCLONE_CONFIG }}" ]; then
            printf '%s' "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
            echo "rclone 設定完了"
          else
            echo "RCLONE_CONFIG 未設定 → Google Drive アップロードをスキップ"
            python -c "
import yaml
with open('config.yaml') as f: cfg = yaml.safe_load(f)
cfg['drive']['enabled'] = False
with open('config.yaml', 'w') as f: yaml.dump(cfg, f, allow_unicode=True)
"
          fi

      - name: Run clipper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIP_COUNT: ${{ github.event.inputs.count || '3' }}
        run: |
          mkdir -p output temp data logs fonts

          python - <<'PY'
          import yaml, os
          path = 'config.yaml'
          with open(path) as f: cfg = yaml.safe_load(f)
          cfg['clips']['count'] = int(os.environ.get('CLIP_COUNT', 3))
          with open(path, 'w') as f: yaml.dump(cfg, f, allow_unicode=True)
          PY

          if [ -n "${{ github.event.inputs.url }}" ]; then
            echo "URL指定モード: ${{ github.event.inputs.url }}"
            python main.py --url "${{ github.event.inputs.url }}"
          else
            echo "新着チェックモード"
            python main.py --once
          fi

      # 処理済みリストを保存して次回の重複処理を防ぐ
      # -f で .gitignore を無視して強制追加
      - name: Save state
        if: always()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f data/processed_videos.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update processed videos [skip ci]"
          git push || true

      - name: Summary
        if: always()
        run: |
          echo "## 実行結果" >> $GITHUB_STEP_SUMMARY
          if ls output/*.mp4 2>/dev/null | grep -q mp4; then
            COUNT=$(ls output/*.mp4 2>/dev/null | wc -l)
            echo "✅ 切り抜き動画 ${COUNT}本 → Google Drive にアップロード済み" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 新着動画なし、またはエラー" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f logs/automation.log ]; then
            echo "### コストログ" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 20 'API使用コスト' logs/automation.log | tail -25 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
