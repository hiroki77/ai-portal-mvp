name: 中町兄妹 切り抜き自動生成

on:
  # 3時間ごとに新着チェック（UTC基準）
  schedule:
    - cron: '0 */3 * * *'

  # ブラウザの「Run workflow」ボタンから手動実行
  workflow_dispatch:
    inputs:
      url:
        description: '動画URL（空欄なら新着チェック）'
        required: false
        type: string
      count:
        description: '生成クリップ数 (デフォルト: 3)'
        required: false
        default: '3'
        type: string

permissions:
  contents: write   # 処理済みリストをコミットバックするため

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 最大3時間

    steps:
      # ────────────────────────────
      # 1. コード取得
      # ────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────
      # 2. Python 環境
      # ────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.cloud.txt

      # ────────────────────────────
      # 3. システム依存パッケージ
      #    ffmpeg: 動画処理
      #    fonts-noto-cjk: 日本語フォント（字幕焼き込み用）
      # ────────────────────────────
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk

      # ────────────────────────────
      # 4. Python ライブラリ（軽量版）
      # ────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.cloud.txt

      # ────────────────────────────
      # 5. Google Drive (rclone) 設定
      #    GitHub Secret "RCLONE_CONFIG" に
      #    base64エンコードした rclone.conf を格納
      # ────────────────────────────
      - name: Setup rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      # ────────────────────────────
      # 6. 切り抜き実行
      # ────────────────────────────
      - name: Run clipper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIP_COUNT: ${{ github.event.inputs.count || '3' }}
        run: |
          mkdir -p output temp data logs fonts

          # クリップ数を config 経由で渡す
          python - <<'PY'
          import yaml, os
          path = 'config.yaml'
          with open(path) as f: cfg = yaml.safe_load(f)
          cfg['clips']['count'] = int(os.environ.get('CLIP_COUNT', 3))
          with open(path, 'w') as f: yaml.dump(cfg, f, allow_unicode=True)
          PY

          if [ -n "${{ github.event.inputs.url }}" ]; then
            echo "URL指定モード: ${{ github.event.inputs.url }}"
            python main.py --url "${{ github.event.inputs.url }}"
          else
            echo "新着チェックモード"
            python main.py --once
          fi

      # ────────────────────────────
      # 7. 処理済みリストをリポジトリに保存
      #    次回実行時に重複処理を防ぐ
      # ────────────────────────────
      - name: Save state
        if: always()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/processed_videos.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update processed videos [skip ci]"
          git push || true

      # ────────────────────────────
      # 8. 完了サマリーを表示
      # ────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## 実行結果" >> $GITHUB_STEP_SUMMARY
          if ls output/*.mp4 2>/dev/null | head -1 | grep -q mp4; then
            COUNT=$(ls output/*.mp4 2>/dev/null | wc -l)
            echo "✅ 切り抜き動画 ${COUNT}本 → Google Drive にアップロード済み" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 新着動画なし、またはエラー" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f logs/automation.log ]; then
            echo "### コストログ" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 20 'API使用コスト' logs/automation.log | tail -25 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
